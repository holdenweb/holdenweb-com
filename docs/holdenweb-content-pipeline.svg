<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 632" width="1000" height="632"
     role="img" aria-label="How each section of holdenweb.com's content is built from source: four sections, each with its own source and builder, all delivered straight into the host's data directory without passing through git, while code reaches the site by a separate rebuild.">
  <title>holdenweb.com — how each section is built from source</title>
  <desc>Four content lanes (Python courses, blog, notebooks, pages). Each has a source and a builder on the laptop, and all pass through one delivery gate — just, push-content.sh, rsync and ssh, then refresh-content.sh on the host — into hostdata/apps/&lt;app&gt;/&lt;tree&gt;, served at its own URL. Code travels a separate path: git push and a container rebuild.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4646e9"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c6f77"/>
    </marker>
  </defs>

  <rect width="1000" height="632" fill="#f6f6ef"/>

  <g font-family="'Gill Sans','Gill Sans MT',Cabin,'Trebuchet MS',sans-serif">
    <text x="24" y="38" font-size="23" font-weight="600" fill="#0d2a8f">holdenweb.com — where each section comes from</text>
    <text x="24" y="60" font-size="12.5" fill="#6c6f77" font-family="-apple-system,'Segoe UI',Arial,sans-serif">Four sections, four sources, one delivery path. File counts as at 2026-09-22.</text>

    <g font-size="10.5" font-weight="600" fill="#6c6f77" letter-spacing="1.2" text-anchor="middle">
      <text x="108" y="96">SOURCE</text>
      <text x="359" y="96">BUILT ON THE LAPTOP</text>
      <text x="649" y="96">ON THE HOST</text>
      <text x="856" y="96">SERVED AT</text>
    </g>
  </g>

  <!-- delivery gate -->
  <rect x="454" y="112" width="80" height="208" rx="10" fill="#ecedfc" stroke="#5475ee" stroke-width="1"/>
  <g font-family="-apple-system,'Segoe UI',Arial,sans-serif" text-anchor="middle" fill="#0d2a8f">
    <text transform="rotate(-90 494 216)" x="494" y="216" font-size="12" font-weight="600">one delivery path</text>
    <text transform="rotate(-90 494 216)" x="494" y="232" font-size="9.5" fill="#3a3c42">just · push-content.sh · rsync+ssh</text>
    <text transform="rotate(-90 494 216)" x="494" y="245" font-size="9.5" fill="#3a3c42">then refresh-content.sh on the host</text>
  </g>

  <g font-family="-apple-system,'Segoe UI',Arial,sans-serif" font-size="11" fill="#3a3c42">

    <!-- lane 1: Python courses -->
    <rect x="24" y="116" width="168" height="48" rx="7" fill="#fff" stroke="#e7e4d4"/>
    <text x="36" y="136" font-weight="600" fill="#0d2a8f">orpy repository</text>
    <text x="36" y="152" font-size="10" fill="#6c6f77">the Python course material</text>
    <line x1="192" y1="140" x2="280" y2="140" stroke="#4646e9" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="236" y="134" font-size="9.5" fill="#4646e9" text-anchor="middle">build.py --fragments</text>
    <rect x="284" y="116" width="150" height="48" rx="7" fill="#fff" stroke="#e7e4d4"/>
    <text x="294" y="136" font-weight="600">python-classes/</text>
    <text x="294" y="152" font-size="10" fill="#6c6f77">HTML fragments</text>
    <line x1="434" y1="140" x2="450" y2="140" stroke="#4646e9" stroke-width="1.4"/>
    <line x1="538" y1="140" x2="550" y2="140" stroke="#4646e9" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="554" y="116" width="190" height="48" rx="7" fill="#fff" stroke="#e7e4d4"/>
    <text x="564" y="136" font-weight="600">pybooks/html-pages</text>
    <text x="564" y="152" font-size="10" fill="#6c6f77">135 files</text>
    <line x1="744" y1="140" x2="790" y2="140" stroke="#4646e9" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="798" y="138" font-size="13" font-weight="600" fill="#0d2a8f">/pybooks</text>
    <text x="798" y="153" font-size="9.5" fill="#6c6f77">podpack-pages</text>

    <!-- lane 2: blog -->
    <rect x="24" y="188" width="168" height="48" rx="7" fill="#fff" stroke="#e7e4d4"/>
    <text x="36" y="208" font-weight="600" fill="#0d2a8f">the previous blog</text>
    <text x="36" y="224" font-size="10" fill="#6c6f77">scraped, not re-typed</text>
    <line x1="192" y1="212" x2="280" y2="212" stroke="#4646e9" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="236" y="206" font-size="9.5" fill="#4646e9" text-anchor="middle">blogscraper export</text>
    <rect x="284" y="188" width="150" height="48" rx="7" fill="#fff" stroke="#e7e4d4"/>
    <text x="294" y="208" font-weight="600">build/</text>
    <text x="294" y="224" font-size="10" fill="#6c6f77">posts, images, manifest</text>
    <line x1="434" y1="212" x2="450" y2="212" stroke="#4646e9" stroke-width="1.4"/>
    <line x1="538" y1="212" x2="550" y2="212" stroke="#4646e9" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="554" y="188" width="190" height="48" rx="7" fill="#fff" stroke="#e7e4d4"/>
    <text x="564" y="208" font-weight="600">blog/export</text>
    <text x="564" y="224" font-size="10" fill="#6c6f77">721 files</text>
    <line x1="744" y1="212" x2="790" y2="212" stroke="#4646e9" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="798" y="210" font-size="13" font-weight="600" fill="#0d2a8f">/blog</text>
    <text x="798" y="225" font-size="9.5" fill="#6c6f77">podpack-pages</text>

    <!-- lane 3: notebooks -->
    <rect x="24" y="260" width="168" height="48" rx="7" fill="#fff" stroke="#e7e4d4"/>
    <text x="36" y="280" font-weight="600" fill="#0d2a8f">Jupyter notebooks</text>
    <text x="36" y="296" font-size="10" fill="#6c6f77">wherever they live; curated</text>
    <line x1="192" y1="284" x2="280" y2="284" stroke="#4646e9" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="236" y="278" font-size="9.5" fill="#4646e9" text-anchor="middle">build.py · nbconvert</text>
    <rect x="284" y="260" width="150" height="48" rx="7" fill="#fff" stroke="#e7e4d4"/>
    <text x="294" y="280" font-weight="600">build/html-pages</text>
    <text x="294" y="296" font-size="10" fill="#6c6f77">one fragment per notebook</text>
    <line x1="434" y1="284" x2="450" y2="284" stroke="#4646e9" stroke-width="1.4"/>
    <line x1="538" y1="284" x2="550" y2="284" stroke="#4646e9" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="554" y="260" width="190" height="48" rx="7" fill="#fff" stroke="#e7e4d4"/>
    <text x="564" y="280" font-weight="600">notebooks/html-pages</text>
    <text x="564" y="296" font-size="10" fill="#6c6f77">3 files</text>
    <line x1="744" y1="284" x2="790" y2="284" stroke="#4646e9" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="798" y="282" font-size="13" font-weight="600" fill="#0d2a8f">/notebooks</text>
    <text x="798" y="297" font-size="9.5" fill="#6c6f77">podpack-notebooks</text>

    <!-- lane 4: pages - no builder, edited on the host -->
    <rect x="24" y="332" width="410" height="48" rx="7" fill="#fff" stroke="#e7e4d4" stroke-dasharray="4 3"/>
    <text x="36" y="352" font-weight="600" fill="#0d2a8f">hand-written Markdown and HTML</text>
    <text x="36" y="368" font-size="10" fill="#6c6f77">no builder, and no delivery path — edited in place on the host</text>
    <line x1="434" y1="356" x2="550" y2="356" stroke="#6c6f77" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ag)"/>
    <rect x="554" y="332" width="190" height="48" rx="7" fill="#fff" stroke="#e7e4d4"/>
    <text x="564" y="352" font-weight="600">pages/md-pages · html-pages</text>
    <text x="564" y="368" font-size="10" fill="#6c6f77">4 + 16 files</text>
    <line x1="744" y1="356" x2="790" y2="356" stroke="#4646e9" stroke-width="1.4" marker-end="url(#a)"/>
    <text x="798" y="354" font-size="13" font-weight="600" fill="#0d2a8f">/pages</text>
    <text x="798" y="369" font-size="9.5" fill="#6c6f77">podpack-pages</text>

    <!-- code path, deliberately separate -->
    <line x1="24" y1="410" x2="976" y2="410" stroke="#e7e4d4"/>
    <text x="24" y="434" font-size="10.5" font-weight="600" fill="#6c6f77" letter-spacing="1.2" font-family="'Gill Sans','Gill Sans MT',Cabin,sans-serif">CODE TAKES A DIFFERENT ROAD</text>

    <rect x="24" y="446" width="240" height="52" rx="7" fill="#fff" stroke="#e7e4d4"/>
    <text x="36" y="466" font-weight="600" fill="#0d2a8f">holdenweb repository</text>
    <text x="36" y="482" font-size="10" fill="#6c6f77">chrome, front page, config</text>
    <rect x="24" y="506" width="240" height="52" rx="7" fill="#fff" stroke="#e7e4d4"/>
    <text x="36" y="526" font-weight="600" fill="#0d2a8f">five packages from PyPI</text>
    <text x="36" y="542" font-size="10" fill="#6c6f77">podpack · pages · notebooks · pdf · qrcode</text>

    <line x1="264" y1="472" x2="330" y2="490" stroke="#4646e9" stroke-width="1.4" marker-end="url(#a)"/>
    <line x1="264" y1="532" x2="330" y2="514" stroke="#4646e9" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="336" y="476" width="198" height="52" rx="7" fill="#fff" stroke="#5475ee"/>
    <text x="348" y="496" font-weight="600">git push · scripts/up.sh</text>
    <text x="348" y="512" font-size="10" fill="#6c6f77">rebuilds the image, stamps the commit</text>
    <line x1="534" y1="502" x2="588" y2="502" stroke="#4646e9" stroke-width="1.4" marker-end="url(#a)"/>
    <rect x="592" y="476" width="180" height="52" rx="7" fill="#fff" stroke="#e7e4d4"/>
    <text x="604" y="496" font-weight="600">the running container</text>
    <text x="604" y="512" font-size="10" fill="#6c6f77">serves every section above</text>

    <text x="792" y="484" font-size="10.5" font-weight="600" fill="#0d2a8f">Content needs no rebuild.</text>
    <text x="792" y="499" font-size="10" fill="#3a3c42">Each page is read from disk as</text>
    <text x="792" y="513" font-size="10" fill="#3a3c42">it is served, so a refreshed tree</text>
    <text x="792" y="527" font-size="10" fill="#3a3c42">is live the moment it lands.</text>

    <text x="24" y="592" font-size="11" fill="#3a3c42">Content never passes through git: it is built on the laptop and delivered straight into the host's data directory. Code does, and only code needs the rebuild.</text>
    <text x="24" y="610" font-size="10" fill="#6c6f77">A tree is refreshed with <tspan font-weight="600">just pybooks staging</tspan> (or blog, notebooks); <tspan font-weight="600">--mirror</tspan> also removes what the source no longer has, and is confirmed before it deletes anything.</text>
  </g>
</svg>
