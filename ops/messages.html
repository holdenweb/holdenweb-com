<title>The 3am Almanac</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#172029; --muted:#5c6672;
  --line:#dde3ea; --line-strong:#c8d1db; --accent:#0d6e78; --accent-ink:#0a565e;
  --crit:#bb2f36; --crit-bg:#fbe9ea; --act:#a55600; --act-bg:#fbeede;
  --warn:#7e6400; --warn-bg:#f6efcf; --info:#37589a; --info-bg:#e9eef8;
  --shadow:0 1px 2px rgba(23,32,41,.06),0 6px 20px rgba(23,32,41,.06);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0c1015; --surface:#141a22; --surface-2:#1a212b; --ink:#e6ebf2; --muted:#8b97a6;
  --line:#242e39; --line-strong:#33404d; --accent:#2bb3c0; --accent-ink:#79dbe4;
  --crit:#ff6b71; --crit-bg:#2b1517; --act:#f2ac52; --act-bg:#2a1f0f;
  --warn:#e0c94c; --warn-bg:#241f0d; --info:#8aa9ea; --info-bg:#151d2c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.36);
}}
:root[data-theme="dark"]{
  --bg:#0c1015; --surface:#141a22; --surface-2:#1a212b; --ink:#e6ebf2; --muted:#8b97a6;
  --line:#242e39; --line-strong:#33404d; --accent:#2bb3c0; --accent-ink:#79dbe4;
  --crit:#ff6b71; --crit-bg:#2b1517; --act:#f2ac52; --act-bg:#2a1f0f;
  --warn:#e0c94c; --warn-bg:#241f0d; --info:#8aa9ea; --info-bg:#151d2c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.36);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px;}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}
a{color:var(--accent-ink);}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:4px;}
h1{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;}
h1 .clock{color:var(--accent);font-variant-numeric:tabular-nums;}
.lede{color:var(--muted);max-width:62ch;margin:.5rem 0 0;}
.lede b{color:var(--ink);font-weight:600;}
.themebtn{flex:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);
  border-radius:9px;width:38px;height:38px;font-size:1rem;cursor:pointer;display:grid;place-items:center;}
.themebtn:hover{color:var(--ink);border-color:var(--accent);}

.tools{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:16px 0 12px;margin:18px 0 6px;border-bottom:1px solid var(--line);}
.searchrow{position:relative;}
#q{width:100%;font:500 1.02rem/1.4 "IBM Plex Mono",monospace;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--line-strong);border-radius:11px;
  padding:14px 44px 14px 16px;box-shadow:var(--shadow);}
#q::placeholder{color:var(--muted);font-weight:400;}
#q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);}
.searchrow .slash{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  border:1px solid var(--line-strong);border-radius:6px;padding:1px 7px;color:var(--muted);
  font:600 .78rem/1.4 "IBM Plex Mono",monospace;pointer-events:none;}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;align-items:center;}
.chip{font:600 .8rem/1 "IBM Plex Sans",sans-serif;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 12px;cursor:pointer;
  display:inline-flex;gap:7px;align-items:center;white-space:nowrap;user-select:none;}
.chip:hover{color:var(--ink);}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;}
.chip[aria-pressed="true"]{color:var(--ink);border-color:currentColor;}
.chip.sev-critical[aria-pressed="true"]{color:var(--crit);background:var(--crit-bg);}
.chip.sev-action[aria-pressed="true"]{color:var(--act);background:var(--act-bg);}
.chip.sev-warning[aria-pressed="true"]{color:var(--warn);background:var(--warn-bg);}
.chip.sev-info[aria-pressed="true"]{color:var(--info);background:var(--info-bg);}
.chip.where[aria-pressed="true"]{color:var(--accent-ink);border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 12%,transparent);}
.dot{width:8px;height:8px;border-radius:50%;flex:none;}
.dot.critical{background:var(--crit);} .dot.action{background:var(--act);}
.dot.warning{background:var(--warn);} .dot.info{background:var(--info);}
.sep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px;}
.count{color:var(--muted);font-size:.86rem;margin:14px 2px 2px;font-variant-numeric:tabular-nums;}

.group{margin-top:26px;}
.group > h2{font-size:.82rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);}
.cards{display:flex;flex-direction:column;gap:10px;}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sev);
  border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);}
.card.critical{--sev:var(--crit);} .card.action{--sev:var(--act);}
.card.warning{--sev:var(--warn);} .card.info{--sev:var(--info);}
.badges{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:9px;}
.badge{font:600 .72rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.02em;
  border-radius:6px;padding:4px 8px;display:inline-flex;gap:5px;align-items:center;}
.badge.sev{background:var(--sev-bg);color:var(--sev-fg);}
.card.critical .badge.sev{--sev-bg:var(--crit-bg);--sev-fg:var(--crit);}
.card.action .badge.sev{--sev-bg:var(--act-bg);--sev-fg:var(--act);}
.card.warning .badge.sev{--sev-bg:var(--warn-bg);--sev-fg:var(--warn);}
.card.info .badge.sev{--sev-bg:var(--info-bg);--sev-fg:var(--info);}
.badge.where{color:var(--muted);border:1px solid var(--line-strong);}
.src{margin-left:auto;color:var(--muted);font:500 .78rem/1 "IBM Plex Mono",monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%;}
.msg{font:500 .92rem/1.5 "IBM Plex Mono",monospace;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;padding:9px 11px;overflow-x:auto;
  white-space:pre-wrap;word-break:break-word;}
.msg mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px;}
.mn{margin:.6rem 0 0;font-size:.92rem;} .mn b{color:var(--muted);font-weight:600;}
.mn.do{margin-top:.35rem;} .mn.do b{color:var(--accent-ink);}
.empty{text-align:center;color:var(--muted);padding:50px 20px;}
.empty .mono{color:var(--ink);}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem;}
@media (max-width:560px){ .src{max-width:100%;margin:6px 0 0;} .badges{gap:6px;} }
@media (prefers-reduced-motion:no-preference){ .card,.chip,#q{transition:border-color .15s,background .15s,color .15s;} }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>The&nbsp;<span class="clock">3am</span>&nbsp;Almanac</h1>
      <p class="lede">Every message this podpack site is likely to put in front of you, with
        <b>where it came from</b>, <b>how worried to be</b>, and <b>what to do</b>. Paste the
        message you're staring at, or type any part of it.</p>
    </div>
    <button class="themebtn" id="theme" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
  </header>

  <div class="tools">
    <div class="searchrow">
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Paste a message, or a phrase from it…" aria-label="Search messages">
      <span class="slash">/</span>
    </div>
    <div class="filters" id="sevfilters"></div>
    <div class="filters" id="wherefilters" style="margin-top:8px"></div>
  </div>
  <div class="count" id="count"></div>
  <div id="results"></div>

  <footer>
    <span id="meta"></span> · Grep the same catalogue on the host in
    <span class="mono">ops/MESSAGES.md</span>. Built from
    <span class="mono">ops/messages.json</span>.
  </footer>
</div>

<script>
const MESSAGES = [{"id": "poll-bad-body", "layer": "laptop", "source": "ops/poll-health.sh", "where": "laptop", "sev": "critical", "match": "<time>: health check FAILED for <url> -- 200 but body lacks \"status\":\"ok\" (the proxy answered; the app or database did not)", "means": "nginx answered 200 (likely its own error page) but the app's health JSON is absent: web is down/unhealthy behind a working proxy, or the database is down.", "do": "Check web + postgres on the host; hit /healthz directly for the reason. Cross-ref healthz-503."}, {"id": "poll-no-200", "layer": "laptop", "source": "ops/poll-health.sh", "where": "laptop", "sev": "critical", "match": "<time>: health check FAILED for <url> -- no 200 (DNS, TLS, the proxy, or the container is down)", "means": "The site did not return 200 from outside: DNS, TLS, the nginx proxy, or the web container is down. The site is unreachable.", "do": "Check the host: `ssh <host> 'cd ~/apps/<app>/site && podman compose ps'`; check DNS/proxy; then ./ops/deploy.sh or restart web."}, {"id": "deploy-bad-remote-url", "layer": "laptop", "source": "ops/deploy.sh", "where": "laptop", "sev": "action", "match": "remote '<target>' is not an scp-style host:path URL: <url>", "means": "The remote exists but is not host:path form, so deploy can't derive the rebuild command.", "do": "Re-point it: `git remote set-url <target> opal17:apps/<app>/site`."}, {"id": "deploy-dirty", "layer": "laptop", "source": "ops/deploy.sh", "where": "laptop", "sev": "action", "match": "uncommitted changes to tracked files; commit first, or pass --allow-dirty.", "means": "Tracked files have uncommitted changes; only commits are pushed, so they would not deploy. Untracked files (a stray README.pdf) do not count.", "do": "Commit them, or pass --allow-dirty to deploy anyway (up.sh then stamps -dirty)."}, {"id": "deploy-no-remote", "layer": "laptop", "source": "ops/deploy.sh", "where": "laptop", "sev": "action", "match": "no git remote named '<target>'. Add it (see ops/DEPLOY.md): git remote add <target> opal17:apps/<app>/site", "means": "The target's git remote is not configured on this laptop.", "do": "Add it per ops/DEPLOY.md: `git remote add <target> opal17:apps/<app>/site`."}, {"id": "deploy-usage", "layer": "laptop", "source": "ops/deploy.sh", "where": "laptop", "sev": "action", "match": "usage: deploy.sh [--dry-run] [--allow-dirty] <staging|production>", "means": "No target (or an unknown flag) was given.", "do": "Re-run with `staging` or `production`."}, {"id": "dev-cannot-reach-db", "layer": "laptop", "source": "scripts/dev.sh", "where": "laptop", "sev": "action", "match": "cannot reach the local database named in dev.env. If PostgreSQL is running, it probably has no role or database for this site yet: createuser --pwprompt <user> / createdb --owner <user> <name>", "means": "podpack will not create the local database itself (the server is yours). The exact commands to create the role and DB are printed. Exit 2.", "do": "Run the printed `createuser --pwprompt <user>` and `createdb --owner <user> <name>`, then re-run dev.sh."}, {"id": "pull-rsync-error", "layer": "laptop", "source": "ops/pull-backups.sh", "where": "laptop", "sev": "action", "match": "rsync: change_dir \"...\" failed: No such file or directory / rsync error: ...", "means": "The pull failed. Commonly the source ~/backups/<SITE_NAME>/ does not exist yet (no backup has run on the host), or ssh to the host failed.", "do": "Confirm backups have run on the host (is backup.cron installed?) and that `ssh <host>` works."}, {"id": "deploy-no-health-url", "layer": "laptop", "source": "ops/deploy.sh", "where": "laptop", "sev": "warning", "match": "==> no health URL configured for <target>; verify it by hand.", "means": "The target (e.g. production before its domain exists) has no health URL, so it deployed but did not self-verify.", "do": "Check the site by hand; set the target's URL in deploy.sh's health_url()."}, {"id": "deploy-not-on-origin", "layer": "laptop", "source": "ops/deploy.sh", "where": "laptop", "sev": "warning", "match": "note: HEAD (<sha>) is not on origin/main -- deploying unpublished code.", "means": "You are deploying a commit that is not on GitHub. Fine for staging; worth noticing for production.", "do": "`git push origin main` to publish, or proceed if this is deliberate."}, {"id": "dev-created-env", "layer": "laptop", "source": "scripts/dev.sh", "where": "laptop", "sev": "warning", "match": "created dev.env from dev.env.example -- review it before going further", "means": "A missing dev.env was seeded from the example.", "do": "Edit dev.env (notably SQLALCHEMY_DATABASE_URI and ports) before continuing."}, {"id": "dev-mongo-note", "layer": "laptop", "source": "scripts/dev.sh", "where": "laptop", "sev": "warning", "match": "note: this site declares mongodb, which a local run does not start. Install one natively and add MONGODB_URI to dev.env, or expect the apps that use it to report themselves unhealthy.", "means": ".env declares mongodb, but a native dev.sh run does not start it; apps needing Mongo will be unhealthy.", "do": "Install MongoDB natively and add MONGODB_URI to dev.env, or accept those apps being unhealthy in local dev."}, {"id": "deploy-progress", "layer": "laptop", "source": "ops/deploy.sh", "where": "laptop", "sev": "info", "match": "==> deploying <sha> to <target> (<host>:<path>) / ==> verifying <url> / ==> <target> is healthy at <sha>", "means": "Normal progress. The last line is success: pushed, rebuilt, and /healthz returned ok.", "do": "Nothing."}, {"id": "dev-server-banner", "layer": "laptop", "source": "scripts/dev.sh", "where": "laptop", "sev": "info", "match": "development server -- one process, no gunicorn, no proxy, debug reloader on. the containerised stack is ./scripts/up.sh, and is what production resembles.", "means": "About to exec flask run --debug: the single-process dev server, not production shape.", "do": "Nothing. Use ./scripts/up.sh when you need production-like behaviour."}, {"id": "pull-success", "layer": "laptop", "source": "ops/pull-backups.sh", "where": "laptop", "sev": "info", "match": "<time>: pulled <host>:<src> -> <dest>", "means": "The off-machine backup copy synced successfully.", "do": "Nothing."}, {"id": "backup-dump-empty", "layer": "host-scripts", "source": "backup.sh", "where": "host", "sev": "critical", "match": "the <service> dump is empty -- refusing to keep a backup that cannot restore", "means": "A store's dump produced a zero-byte file. A backup that can't restore is worse than none, so the whole destination is deleted.", "do": "Check that store's health and credentials (`podman compose logs <service>`); confirm the dump command works. Re-run once it dumps non-empty."}, {"id": "backup-refuse-inside-site", "layer": "host-scripts", "source": "backup.sh", "where": "host", "sev": "critical", "match": "refusing to write a backup inside the site directory: ... it would contain secrets.env in clear. Set BACKUP_ROOT.", "means": "The destination resolves to inside the checkout. A backup holds every secret verbatim; a directory of credentials inside the repo is one careless `git add` from being published. Nothing was written.", "do": "Set BACKUP_ROOT outside the working tree, e.g. ~/backups/<site>."}, {"id": "backup-refuse-mount-mismatch", "layer": "host-scripts", "source": "backup.sh", "where": "host", "sev": "critical", "match": "REFUSING: the running web container does not mount this directory's app data. ... Another deployment is using this compose project name.", "means": "Two checkouts share the same compose project name, so compose's `web` belongs to a different deployment. Backing up now would dump one deployment's DB beside another's app data.", "do": "Stop the other deployment or give this one a distinct SITE_NAME. The printed lists show expected vs actual mount; reconcile before backing up."}, {"id": "backup-refuse-no-web-container", "layer": "host-scripts", "source": "backup.sh", "where": "host", "sev": "critical", "match": "REFUSING: compose will not say which container is this project's web, so nothing here can prove the containers belong to this directory.", "means": "`podman compose ps -q web` returned nothing, so the script cannot prove the running containers belong to this checkout. Fails closed on purpose.", "do": "Check the stack is this deployment's (`podman compose ps`), that SITE_NAME/project name is right, and that compose is v2. Bring up the correct stack, then re-run."}, {"id": "backup-store-missing-dump", "layer": "host-scripts", "source": "backup.sh", "where": "host", "sev": "critical", "match": "a store named in the plan produced no dump: <file>", "means": "A store named in the plan produced no dump file at all (the cross-check that counts plan stores against written files). Destination deleted.", "do": "Re-run; if it recurs, inspect the store. Treat any surviving backup taken before this fix as suspect."}, {"id": "cfg-refuse-overwrite", "layer": "host-scripts", "source": "configure-host.py", "where": "host", "sev": "critical", "match": "refusing to overwrite: <files> ... These carry a live site's identity -- the salt every stored password is keyed on, and the role the database was created with. Regenerating them does not reconfigure the site, it loses it. Use --force only on a site with no data yet.", "means": ".env/secrets.env already exist. Overwriting would regenerate SECURITY_PASSWORD_SALT (every stored password becomes unverifiable) and the DB role/name -- i.e. lose the site. Nothing was changed.", "do": "Do NOT --force on a site with data. To inspect, use --check. Only --force on a site with no data yet."}, {"id": "prepare-not-a-lab", "layer": "host-scripts", "source": "prepare-host-dirs.sh", "where": "host", "sev": "critical", "match": "PODPACK_ENVIRONMENT=<env>, so this is not a lab, and ... resolves to <path>, which is inside the checkout ... Point it somewhere the checkout does not own ... Set PODPACK_ENVIRONMENT to 'local' if this really is a lab.", "means": "On a non-lab deployment, HOST_DATA_DIR/HOST_LOG_DIR resolve inside the git checkout -- where a `git clean -fdx`, fresh clone, or rebuild would wipe live data. Anything but `local` (typos included) triggers it. Exit 1.", "do": "Point data/log dirs outside the checkout (../data, ../logs beside site/). Only set PODPACK_ENVIRONMENT=local if this is genuinely a throwaway lab."}, {"id": "restore-count-mismatch", "layer": "host-scripts", "source": "restore.sh", "where": "host", "sev": "critical", "match": "<schema>.<table>   MISMATCH: expected <a>, found <b>", "means": "A table's live row count does not match the backup: the data is not fully restored (an empty dump restores cleanly and looks perfect -- this is what catches it). Restore exits non-zero.", "do": "Do not treat the site as restored. Investigate the store restore (logs, dump integrity); re-restore from a verified backup."}, {"id": "restore-counts-not-matched", "layer": "host-scripts", "source": "restore.sh", "where": "host", "sev": "critical", "match": "row counts do not match the backup -- the data is NOT fully restored", "means": "Final gate: at least one table mismatched. The site may be up but the data is incomplete.", "do": "Do not go live on it. Re-restore from a verified backup; investigate why the dump was short."}, {"id": "restore-not-healthy", "layer": "host-scripts", "source": "restore.sh", "where": "host", "sev": "critical", "match": "the site is not healthy -- see 'podman compose logs web'", "means": "/healthz never returned 200 -- the restored site is effectively down. Common causes: migrate failed, DB auth (URI vs role drift), bad .env.", "do": "`podman compose logs web` (and migrate). Fix and re-run."}, {"id": "verify-app-data-empty", "layer": "host-scripts", "source": "verify-backup.sh", "where": "host", "sev": "critical", "match": "FAILED: <n> app(s) keep data, and the archive holds nothing", "means": "The plan says apps keep data, but the app-data archive is empty -- data that should exist wasn't captured.", "do": "Distrust the backup; investigate the backup run's app-data step. Re-take."}, {"id": "verify-dump-corrupt", "layer": "host-scripts", "source": "verify-backup.sh", "where": "host", "sev": "critical", "match": "FAILED: <service>'s dump could not be read right through / the archive is truncated or corrupt: <file>", "means": "The store's own tool could not read the dump end to end -- truncated or corrupt. Exactly the failure verify exists to catch early.", "do": "This backup cannot restore that store. Take and verify a fresh backup now; keep the last known-good one."}, {"id": "verify-no-table-data", "layer": "host-scripts", "source": "verify-backup.sh", "where": "host", "sev": "critical", "match": "FAILED: the database dump contains no table data at all", "means": "The Postgres dump is a valid archive holding zero TABLE DATA -- what a dump of the wrong or empty database looks like. The silent-empty-backup disaster.", "do": "Do not trust it. Confirm the site actually had data; check the backup (right container? right DB?). Re-take."}, {"id": "backup-no-env", "layer": "host-scripts", "source": "backup.sh", "where": "host", "sev": "action", "match": "no .env -- nothing to back up; this is not a deployed site", "means": "There is no .env in the tree, so this is not a deployed site.", "do": "You are probably in the wrong directory. cd to the real deployment (~/apps/<app>/site)."}, {"id": "backup-plan-no-store", "layer": "host-scripts", "source": "backup.sh", "where": "host", "sev": "action", "match": "the plan names no backing store, so this would archive no data at all / (are the PODPACK_SERVICE_* markers set? see compose.yaml)", "means": "The plan lists zero backing stores, so the backup would contain no data. Usually the PODPACK_SERVICE_* env markers are unset. The half-made destination is removed.", "do": "Set the PODPACK_SERVICE_* markers in compose.yaml / overlays, then re-run."}, {"id": "backup-web-not-running", "layer": "host-scripts", "source": "backup.sh", "where": "host", "sev": "action", "match": "the web service is not running, so nothing can say what to back up / bring the site up, or restore from an existing backup instead", "means": "The web container is not running, so `podpack backup plan` can't be asked what to archive.", "do": "./scripts/up.sh to bring the stack up, then re-run; or restore from an existing backup."}, {"id": "cfg-linger-off", "layer": "host-scripts", "source": "configure-host.py", "where": "host", "sev": "action", "match": "lingering is off, so the containers and the podman socket stop when you log out. loginctl enable-linger <uid>", "means": "Without linger, rootless containers and the podman socket die at logout (Opalstack needs this).", "do": "`loginctl enable-linger <uid>`."}, {"id": "cfg-not-v2", "layer": "host-scripts", "source": "configure-host.py", "where": "host", "sev": "action", "match": "the compose provider is not Compose v2 -- podman-compose silently ignores depends_on conditions, which is what sequences migrate before web. Install the v2 binary and set PODMAN_COMPOSE_PROVIDER.", "means": "The wrong compose provider is active. podman-compose ignores the depends_on gates that order init-storage -> postgres -> migrate -> web -- every ordering guarantee breaks.", "do": "Install the Compose v2 binary and set PODMAN_COMPOSE_PROVIDER. Never run the stack under podman-compose."}, {"id": "cfg-socket-missing", "layer": "host-scripts", "source": "configure-host.py", "where": "host", "sev": "action", "match": "<sock> is missing -- Compose v2 talks to podman through it. systemctl --user enable --now podman.socket", "means": "The rootless podman API socket isn't running; Compose v2 needs it.", "do": "`systemctl --user enable --now podman.socket`."}, {"id": "restore-incomplete-backup", "layer": "host-scripts", "source": "restore.sh", "where": "host", "sev": "action", "match": "backup is incomplete: <backup>/<file> is missing or empty", "means": "A required member (manifest.txt, plan.json, app-data.tar.gz, env, secrets.env) is missing or empty; this backup can't be restored.", "do": "Use a different, complete backup; run verify-backup.sh on candidates first."}, {"id": "restore-prompt", "layer": "host-scripts", "source": "restore.sh", "where": "host", "sev": "action", "match": "This will REPLACE the data and secrets above. Type 'restore' to go on:", "means": "Interactive confirmation gate (skipped only with --yes). Anything other than the literal word `restore` aborts.", "do": "Type `restore` to proceed; anything else aborts safely."}, {"id": "restore-store-unhealthy", "layer": "host-scripts", "source": "restore.sh", "where": "host", "sev": "action", "match": "<service> did not become healthy; see 'podman compose logs <service>'", "means": "A store never reached healthy within ~120s; restore stops. App data and .env/secrets.env are in place but no data has been loaded.", "do": "`podman compose logs <service>` for why (mount ownership, PGDATA mode, healthcheck args). Fix and re-run."}, {"id": "verify-required-missing", "layer": "host-scripts", "source": "verify-backup.sh", "where": "host", "sev": "action", "match": "FAILED: <file> is missing or empty", "means": "A required backup member is absent or zero-length -- the backup is structurally incomplete.", "do": "Distrust this backup. Take a fresh one; if this was the latest, investigate the backup run."}, {"id": "verify-store-not-running", "layer": "host-scripts", "source": "verify-backup.sh", "where": "host", "sev": "action", "match": "FAILED: <service> is not running, so its dump cannot be read / bring the stack up; verification needs the store's own tooling", "means": "Verification reads each dump with the store's own tool inside its container; that store isn't up. A limitation of the check, not necessarily a bad backup.", "do": "./scripts/up.sh, then re-run verification."}, {"id": "cfg-still-example-credential", "layer": "host-scripts", "source": "configure-host.py", "where": "both", "sev": "warning", "match": "still the example's value, and needs changing: <VAR> (<file>)", "means": "A credential-shaped variable still equals the example -- a lab value that won't authenticate, and for a live site a published credential. Often a site's own key the script doesn't generate (e.g. MAIL_PASSWORD).", "do": "Edit those variables in .env/secrets.env to real values before the site serves."}, {"id": "manifest-alembic-unknown", "layer": "host-scripts", "source": "backup.sh (manifest.txt)", "where": "host", "sev": "warning", "match": "alembic revision: UNKNOWN", "means": "The schema revision this data belongs to is unrecorded -- the one fact a restore most needs. Postgres was likely unhealthy at backup time.", "do": "Prefer a fresh backup where the revision is recorded; a backup with UNKNOWN here is harder to restore safely."}, {"id": "manifest-running-build-unknown", "layer": "host-scripts", "source": "backup.sh (manifest.txt)", "where": "host", "sev": "warning", "match": "running build: UNKNOWN (the web container did not report a build stamp)", "means": "The running web container carried no build stamp, so the manifest can't say which code produced the data.", "do": "Rebuild with ./scripts/up.sh (it stamps the commit) so future backups can name the serving build. The data is still valid."}, {"id": "prepare-created-env", "layer": "host-scripts", "source": "prepare-host-dirs.sh", "where": "host", "sev": "warning", "match": "created <.env|secrets.env> from <file>.example -- review it before going further", "means": "A missing .env or secrets.env was seeded from its example. Example secrets.env holds LAB credentials; a fresh secrets.env is only right for a site with no data yet.", "do": "For a real deployment, run configure-host.py (which generates real secrets) rather than shipping example values. Review the file first."}, {"id": "restore-cleanup-notice", "layer": "host-scripts", "source": "restore.sh", "where": "host", "sev": "warning", "match": "this restore set these aside for you to read: ... delete them once you are satisfied -- secrets.env.superseded-* is a copy of every secret this site has, and none of these is ignored", "means": ".superseded-* and .env.from-backup were left in the tree. On older sites they are NOT gitignored, and one is a clear copy of every secret -- a `git add` from publication.", "do": "Read them if useful, then delete them. Confirm they aren't staged or committed."}, {"id": "restore-env-key-differs", "layer": "host-scripts", "source": "restore.sh", "where": "host", "sev": "warning", "match": "<KEY>: keeping <mine>, backup had <theirs>", "means": "A per-host key (SITE_NAME, WEB_HOST_PORT, HOST_DATA_DIR ...) differs between this host and the backup; this host's value is kept. Every one of these has been wrong on a real restore at least once.", "do": "Confirm keeping this host's value is right (usually yes on the same host; check carefully on a replacement)."}, {"id": "restore-installed-backup-env", "layer": "host-scripts", "source": "restore.sh", "where": "host", "sev": "warning", "match": "no .env here, so the backup's was installed. These describe the host it came from, and want checking before this site answers anywhere else:", "means": "A fresh clone had no .env, so the backup's was installed wholesale -- and it describes the OLD host (ports, paths, bind address, SITE_NAME).", "do": "Edit .env for this host before exposing the site: especially WEB_BIND_ADDR, WEB_HOST_PORT, HOST_DATA_DIR, SITE_NAME."}, {"id": "restore-warn-commit-mismatch", "layer": "host-scripts", "source": "restore.sh", "where": "host", "sev": "warning", "match": "WARNING: this checkout is not the commit the backup was taken from. (The checkout is NEWER ... this is fine. OR ... OLDER or unrelated ... Prefer: git checkout <commit>)", "means": "Code and data are from different commits. NEWER is fine (alembic rolls forward). OLDER/unrelated is the concern: the backup's schema may describe tables this code doesn't know. Deliberately a warning, not an auto-checkout.", "do": "If NEWER, proceed. If OLDER/unrelated, `git checkout <backup-commit>` first unless you intend to roll forward."}, {"id": "verify-all-empty", "layer": "host-scripts", "source": "verify-backup.sh", "where": "host", "sev": "warning", "match": "NOTE: every table is empty. Right for a site that has no data yet; alarming for one that had some yesterday. Only you know which.", "means": "Every recorded table has zero rows. Legitimate for a brand-new site; a red flag for an established one. Not a failure.", "do": "If this site had data yesterday, treat as a possible bad backup and investigate; otherwise fine."}, {"id": "verify-fewer-rows", "layer": "host-scripts", "source": "verify-backup.sh", "where": "host", "sev": "warning", "match": "NOTE: this backup holds less than <previous> did. ... Deletions look exactly like this. So does a backup of a site that was seeded rather than restored.", "means": "Fewer rows (or tables) than the previous backup. Could be legitimate deletions -- or the signature of a site that was seeded (aborted restore then brought up) whose backup silently becomes the latest.", "do": "Establish which before this becomes the copy you reach for. If you didn't delete that data, prefer an earlier verified backup and investigate."}, {"id": "backup-complete", "layer": "host-scripts", "source": "backup.sh", "where": "host", "sev": "info", "match": "backup complete: <dest>", "means": "Success. The whole backup is owner-only (chmod -R go-rwx).", "do": "Nothing. Optionally verify it now with verify-backup.sh."}, {"id": "cfg-wrote", "layer": "host-scripts", "source": "configure-host.py", "where": "host", "sev": "info", "match": "wrote .env and secrets.env (0600) for '<site>' (then port / database / SELinux / secrets generated; none printed)", "means": "Success -- fresh config written 0600. Secrets were generated with a URL-safe alphabet and never printed.", "do": "Nothing. `SELinux detected -- mounts will be relabelled` means :Z/,z flags were set (getting that wrong yields a healthy-looking Postgres whose db-init never ran)."}, {"id": "manifest-app-skipped-stateless", "layer": "host-scripts", "source": "backup.sh (manifest.txt)", "where": "host", "sev": "info", "match": "<app> declared SKIPPED, declared stateless", "means": "That app said it stores nothing, so no data was archived for it -- expected, not an omission.", "do": "Nothing, unless an app you know holds data shows SKIPPED -- then its site_app data declaration is wrong."}, {"id": "restore-complete", "layer": "host-scripts", "source": "restore.sh", "where": "host", "sev": "info", "match": "restore complete, and checked.", "means": "Success -- health 200 and every row count matched.", "do": "Nothing. Then handle the cleanup notice if shown."}, {"id": "up-building-from", "layer": "host-scripts", "source": "up.sh", "where": "host", "sev": "info", "match": "building from <sha>  (or <sha>-dirty, or unknown)", "means": "Rebuilding and stamping this commit into the image. `-dirty` = built from an uncommitted tree (normal while working); `unknown` = a repo with no commits (a brand-new site's first build).", "do": "Nothing normally. On production, -dirty or unknown means the running image has no clean commit behind it -- commit and re-run for a reproducible build."}, {"id": "verify-verified", "layer": "host-scripts", "source": "verify-backup.sh", "where": "host", "sev": "info", "match": "VERIFIED: <backup> (then taken / from host / source directory / git commit / alembic revision / services)", "means": "Success -- every leg read clean. A scheduled run exits 0.", "do": "Nothing. This is the pass line."}, {"id": "cfg-cannot-start-secrets", "layer": "app", "source": "config.py", "where": "both", "sev": "critical", "match": "this site cannot start: not set: <names>; still holding a placeholder: <names> -- the file was installed and never edited. Secrets come from the environment, which compose fills from secrets.env; a local run gets them from dev.env via scripts/dev.sh.", "means": "One or more required secrets are empty/unset, or still a placeholder (CHANGEME, an unresolved @@TOKEN@@). Reports ALL offenders at once, each annotated with who needs it. Crashes web (and migrate for the DB URI) at boot.", "do": "Fill the named vars in secrets.env (container) or dev.env (local). Empty (SECRET_KEY=) counts as missing. Never commit values."}, {"id": "cfg-config-not-mounted", "layer": "app", "source": "config.py", "where": "both", "sev": "critical", "match": "host configuration not mounted at <path> -- check the ./config bind mount in compose.yaml", "means": "The TOML host config (default /etc/podpack/app.toml) isn't a file at that path -- usually a wrong or missing ./config bind mount. web crash-loops.", "do": "Fix the ./config/app.toml:/etc/podpack/app.toml:ro mount in compose.yaml; confirm the file exists."}, {"id": "cfg-require-env", "layer": "app", "source": "config.py", "where": "both", "sev": "critical", "match": "required environment variable <NAME> is not set", "means": "A single required env var (SECRET_KEY, SQLALCHEMY_DATABASE_URI, SECURITY_PASSWORD_SALT) was absent -- the one-name-at-a-time backstop behind the richer check above.", "do": "Set the named variable in secrets.env (container) or dev.env (local)."}, {"id": "healthz-db-down", "layer": "app", "source": "core.py", "where": "both", "sev": "critical", "match": "{\"database\":\"<sqlalchemy error>\",\"status\":\"unhealthy\"}  -- HTTP 503", "means": "SELECT 1 against the database raised; the site is up but has no working DB. The container healthcheck sees 503 -> the whole stack is marked unhealthy.", "do": "Check PostgreSQL (postgres service health, SQLALCHEMY_DATABASE_URI, the grant/search_path). The error text is SQLAlchemy's own."}, {"id": "mig-missing-schema", "layer": "app", "source": "alembic/env.py", "where": "host", "sev": "critical", "match": "This connection's search_path is '<sp>', and no schema in it exists. Every CREATE TABLE below would fail ... To repair it, connect as the superuser and run: CREATE SCHEMA IF NOT EXISTS app AUTHORIZATION <the application role>; ... Restoring with scripts/restore.sh instead avoids this entirely.", "means": "The role's search_path names a schema (app) that no longer exists -- the classic aftermath of dropdb/createdb by hand: db-init runs only while the data dir is empty, so a recreated DB comes back with only public. Runs in migrate -> web never starts.", "do": "Run the printed CREATE SCHEMA ... AUTHORIZATION <app role> as superuser (role = POSTGRES_APP_USER in secrets.env) -- or restore via scripts/restore.sh, which brings each store up alone so its bootstrap runs first."}, {"id": "mig-no-database-uri", "layer": "app", "source": "alembic/env.py", "where": "both", "sev": "critical", "match": "SQLALCHEMY_DATABASE_URI is not set. Migrations read it from the environment, as the site does -- compose supplies it from secrets.env, and a local run gets it from dev.env via scripts/dev.sh.", "means": "Alembic env found no DB URI. env.py deliberately does NOT load_dotenv() -- a bare `alembic upgrade head` will not silently reach a stray .env (that was a measured near-miss on the live DB). Runs in migrate -> web never starts.", "do": "Run migrations through scripts/dev.sh (sources dev.env) or compose (supplies secrets.env); don't rely on a stray .env."}, {"id": "proxy-hops-not-a-number", "layer": "app", "source": "proxy.py", "where": "both", "sev": "critical", "match": "PODPACK_PROXY_HOPS is '<raw>', which is not a whole number. It counts the proxies between the internet and this site: 1 where a single nginx forwards to it, unset where nothing does.", "means": "PODPACK_PROXY_HOPS is set to a non-integer (or negative). Refused rather than defaulted, because a deployment that meant to proxy but serves unproxied reproduces the cleartext reset-link bug this module fixes.", "do": "Set PODPACK_PROXY_HOPS to a whole number (1 behind a single nginx), or unset it entirely."}, {"id": "reg-clashing-table", "layer": "app", "source": "registry.py", "where": "both", "sev": "critical", "match": "installing '<module>' failed: it declares the table '<t>' (already needed by <apps> / already on db.metadata). Table names are shared across every installed app ... so prefix __tablename__ with the app's own name.", "means": "Two installed apps define the same __tablename__. SQLAlchemy's own error names the table but neither app; this names who's involved.", "do": "Prefix the offending __tablename__ with the app's own name so table names don't collide."}, {"id": "reg-duplicate-blueprint-name", "layer": "app", "source": "registry.py", "where": "both", "sev": "critical", "match": "two installed apps share the blueprint name '<name>'; it has to be unique because it decides the template namespace, the data and log directories, and the config section", "means": "Two apps in apps resolve to the same blueprint name; that name is the app's whole identity, so it must be unique.", "do": "Rename one app's blueprint, or drop the duplicate from apps."}, {"id": "reg-missing-table-dependency", "layer": "app", "source": "registry.py", "where": "both", "sev": "critical", "match": "this site is missing a table that nothing installed defines: <table>, needed by <apps>. Either add the app that defines it to [site] apps, or stop installing the app that needs it.", "means": "An installed app declares needs_tables for a table no installed app defines. The site would serve every page and fail on the first query that touches it.", "do": "Add the app that defines the table to [site] apps, or remove the app that needs it."}, {"id": "reg-mount-for-uninstalled-app", "layer": "app", "source": "registry.py", "where": "both", "sev": "critical", "match": "[site.mounts] mounts <names>, which no installed app answers to. Installed apps: <installed>. Note the key is the app's name -- that is, its blueprint's name -- which is not always the import name listed in apps.", "means": "[site.mounts] names an app that isn't installed -- a typo, or an app dropped from apps while its mount stayed.", "do": "Fix the [site.mounts] key to the app's blueprint name (not necessarily the import name in apps), or delete the stale mount."}, {"id": "reg-nav-endpoint-missing", "layer": "app", "source": "registry.py", "where": "both", "sev": "critical", "match": "<name> contributes the nav entry '<label>' naming the endpoint '<endpoint>', which no view provides; nav entries name endpoints rather than paths so that they follow the app wherever the site mounts it", "means": "An app's Section names an endpoint no view provides. Caught at boot because otherwise url_for raises BuildError while rendering the chrome -- on every page.", "do": "Fix the endpoint string in the app's nav=(Section(...),) to a real blueprint.view name."}, {"id": "reg-no-site-app", "layer": "app", "source": "registry.py", "where": "both", "sev": "critical", "match": "<module> is listed as an installed app but exposes no module-level `site_app`; see podpack.registry for the contract", "means": "A name in [site] apps imports fine but has no module-level site_app. Also fires in the migrate container, so it surfaces there rather than one service later in web.", "do": "Give the app package a module-level `site_app = SiteApp(...)`, or remove it from apps."}, {"id": "reg-site-app-wrong-type", "layer": "app", "source": "registry.py", "where": "both", "sev": "critical", "match": "<module>.site_app is a <TypeName>, not a SiteApp. A podpack app wraps its blueprint rather than exporting it: site_app = SiteApp(blueprint=..., url_prefix=...)", "means": "site_app exists but is the wrong type -- classically `site_app = blueprint`, the natural move from plain Flask.", "do": "Wrap the blueprint: `site_app = SiteApp(blueprint=..., ...)`."}, {"id": "reg-url-prefix-in-app-config", "layer": "app", "source": "registry.py", "where": "both", "sev": "critical", "match": "[apps.<name>] sets url_prefix, which podpack no longer reads. Mount points belong to the site, so move it to: [site.mounts] <name> = \"...\"", "means": "The old spelling -- mount point under the app's own [apps.<name>] table. Refused rather than silently ignored.", "do": "Move url_prefix out of [apps.<name>] into [site.mounts] <name> = \"...\"."}, {"id": "urls-bad-base-url", "layer": "app", "source": "urls.py", "where": "both", "sev": "critical", "match": "[site] base_url is '<value>', which has no scheme and host. It is the site's canonical public address, so it needs to look like 'https://example.com'.", "means": "[site] base_url is set but scheme-less/host-less, which urljoin would silently mangle. Caught at boot rather than in the first mail that carries a link.", "do": "Set base_url to a full https://host form, or remove it (it's optional -- only needed for request-less link building)."}, {"id": "healthz-app-unhealthy", "layer": "app", "source": "core.py", "where": "both", "sev": "action", "match": "{\"apps\":{\"<app>\":{\"status\":\"unhealthy\",\"detail\":\"...\",\"fatal\":true}},\"status\":\"unhealthy\"}  -- 503 only when fatal", "means": "An installed app's healthz() returned unhealthy or raised. Operators (admin) see ms/detail/fatal; non-operators see only status. Only fatal=true apps take the site to 503.", "do": "Read detail (as operator, or in /_status) to see which app and why. A non-fatal unhealthy app means one feature is degraded, not the site."}, {"id": "hw-mail-send-failed", "layer": "app", "source": "holdenweb mail_util.py", "where": "both", "sev": "action", "match": "could not send the '<template>' email to <recipient>: <ExcType>: <exc>", "means": "flask-security tried to send mail (password reset is the one that matters) and the backend raised -- dead/expired SMTP credential, network, TLS. Without this it becomes a 500 with a traceback on the reset form.", "do": "Diagnose the mail credential with `flask --app holdenweb mail check`. <template> tells you which mail; <ExcType> the failure family."}, {"id": "hw-mail-visitor-flash", "layer": "app", "source": "holdenweb mail_util.py", "where": "both", "sev": "action", "match": "That email could not be sent just now -- a problem at our end, not with your account. Please try again shortly.", "means": "Shown to a visitor whose mail failed, so they don't wait forever after flask-security's cheerful 'instructions have been sent'. It means real mail delivery is down.", "do": "Fix SMTP (see hw-mail-send-failed and mail check). Reset mail is only reached for addresses that have an account."}, {"id": "hw-mailcheck-fail", "layer": "app", "source": "holdenweb commands.py", "where": "both", "sev": "action", "match": "SMTP auth FAILED: <ExcType>  (then <exc>; exit 1)", "means": "`flask --app holdenweb mail check` -- the mail server rejected the connection/credential. Non-zero exit so a deploy step can gate on it. The definitive mail diagnosis, faster than a reset round-trip.", "do": "Read <ExcType>/<exc>; fix credential or account (535 = auth). Password shape is checked too: a Google App Password is 16 lowercase letters, no spaces."}, {"id": "mig-foreign-autogenerate", "layer": "app", "source": "migrations.py", "where": "laptop", "sev": "action", "match": "refusing to autogenerate against <dialect>: this site deploys on postgresql, and a revision written here can be one PostgreSQL rejects. Point SQLALCHEMY_DATABASE_URI at a PostgreSQL first -- dev.env names your local one. Applying migrations (alembic upgrade head) is not restricted.", "means": "You ran `alembic revision --autogenerate` against SQLite (or other), which produces revisions PostgreSQL rejects. Refused (not warned) because the bad file outlives the session and gets applied to prod unwatched.", "do": "Point SQLALCHEMY_DATABASE_URI at your local PostgreSQL (dev.env names it) before autogenerating. Applying migrations is never blocked."}, {"id": "boot-no-admin-role", "layer": "app", "source": "__init__.py", "where": "both", "sev": "warning", "match": "no 'admin' role exists, so /_status will answer 404 to everyone -- including you. Create it and grant it: flask --app <name> roles create admin / roles add <email> admin", "means": "The site booted, but no admin role exists, so /_status (and holdenweb's /config) 404 for everyone including the operator. Normal on a brand-new site; a lockout if you expected admin access.", "do": "Run the two `flask ... roles` commands it prints (and `flask users create` first if you have no user)."}, {"id": "paths-file-logging-disabled", "layer": "app", "source": "paths.py", "where": "both", "sev": "warning", "match": "file logging disabled for <module>: <exc>", "means": "Couldn't open <log_root>/<app>/<app>.log (permissions/mount). The app still runs and still logs to stdout; only its own file handler is missing.", "do": "Check the log-root bind-mount ownership/writability (cross-ref /_status log_dir_writable)."}, {"id": "reg-backup-claim-contradicted", "layer": "app", "source": "registry.py", "where": "both", "sev": "warning", "match": "app '<name>' says it stores nothing, but <data_dir> holds <files>. A backup will skip it on the app's word: either the declaration is wrong, or those files are not wanted.", "means": "An app declared Backup(data=False) but its data directory is not empty. The only SiteApp declaration that warns instead of refusing to boot. Also on /_status.", "do": "Fix the app's backs_up declaration, or remove the stray files. Left alone, backups silently skip that directory."}, {"id": "reg-unprefixed-table-warning", "layer": "app", "source": "registry.py", "where": "both", "sev": "warning", "match": "app '<name>' declares the table '<t>', which its own name does not prefix. ... a second app claiming '<t>' will stop a site booting. Name it in the app's needs_tables if it is deliberate.", "means": "An app defines a table whose name isn't prefixed by the app name -- a latent collision that boot-fails whichever site later installs a second app claiming that name.", "do": "Prefix the table name, or (if deliberately shared) list it in the app's needs_tables to silence the warning."}, {"id": "boot-admin-check-skipped", "layer": "app", "source": "__init__.py", "where": "both", "sev": "info", "match": "could not check for the 'admin' role: <exc>", "means": "Benign. The auth tables don't exist yet (fresh DB, or a test DB), so the admin-role diagnostic couldn't run. Ordinary on first boot before migrate has run.", "do": "Nothing. If tables should exist, check the migrate service ran."}, {"id": "healthz-ok", "layer": "app", "source": "core.py", "where": "both", "sev": "info", "match": "{\"status\":\"ok\",\"database\":\"ok\"}  -- HTTP 200", "means": "Liveness + readiness passed: SELECT 1 succeeded and no fatal app-health failure. The container healthcheck reads only the status code.", "do": "Nothing. This is the healthy state."}, {"id": "hw-config-404", "layer": "app", "source": "holdenweb views.py", "where": "both", "sev": "info", "match": "/config -> HTTP 404 (to any non-admin)", "means": "/config serialises the ENTIRE Flask config -- SECRET_KEY, DB URI, MAIL_PASSWORD among it -- so it 404s (not 403) to anyone who isn't admin, like /_status. The guard fails closed.", "do": "If an operator gets 404 here, it's the missing-admin-role story again (boot-no-admin-role). If a NON-admin ever gets 200, treat as a serious exposure and rotate every secret."}, {"id": "status-404-to-non-admin", "layer": "app", "source": "core.py", "where": "both", "sev": "info", "match": "/_status -> HTTP 404 (to any non-operator)", "means": "/_status deliberately answers 404, not 403, to anyone who isn't an operator -- including when the admin role doesn't exist yet, or the guard failed closed. A refusal and a nonexistent route look identical on purpose.", "do": "If you are locked out, you likely have no admin role/grant (see boot-no-admin-role). Otherwise this is the intended response."}, {"id": "status-fields", "layer": "app", "source": "core.py", "where": "both", "sev": "info", "match": "/_status -> 200 JSON: database, database_user, database_schema, site, config_source, build_commit, data_root, log_root, proxy{}, unclaimed{}, apps{}", "means": "The operator's ground truth for where state lives. build_commit answers 'is the container running this commit?' (a -dirty suffix = built from an uncommitted tree). apps.<n>.data_dir_writable=false is a mount-ownership problem.", "do": "Read it when a mount, grant, config edit, or 'which commit is live?' is in question. Operator only."}, {"id": "status-unclaimed-nonempty", "layer": "app", "source": "core.py", "where": "both", "sev": "info", "match": "/_status unclaimed.data / unclaimed.logs / unclaimed.tables non-empty", "means": "Files, dirs, or tables that no currently-installed app answers for -- normally the residue of an app REMOVED from apps (its data is kept, never auto-deleted). Not an error.", "do": "Confirm it's expected leftover state. Reported, never tidied -- deletion is your call."}, {"id": "state-hand-edited", "layer": "substrate", "source": "substrate/__init__.py", "where": "both", "sev": "critical", "match": "<path> is missing <fields>. It is written by `podpack substrate` and not meant to be edited by hand; restore it from version control.  (also: cannot read substrate.json: <exc>)", "means": "substrate.json was hand-edited, truncated, or corrupt. Exit 2 distinguishes corruption from ordinary pending work (exit 1).", "do": "`git checkout substrate.json`."}, {"id": "state-schema-newer", "layer": "substrate", "source": "substrate/__init__.py", "where": "both", "sev": "critical", "match": "<path> was written with substrate schema <N>, and this podpack understands <M>. Upgrade podpack, or restore the substrate.json that matches the pinned version.", "means": "substrate.json came from a NEWER podpack (a pin was rolled back). Refuses rather than misread it.", "do": "Upgrade podpack, or restore the matching substrate.json from git."}, {"id": "cli-conflicts-summary", "layer": "substrate", "source": "podpack cli", "where": "both", "sev": "action", "match": "<N> conflict(s): the .new files hold podpack's version; resolve each with --take-upstream PATH or --keep PATH", "means": "Upgrade finished with unresolved conflicts; the recorded podpack_version did NOT advance (stays visibly pending).", "do": "Resolve each .new with --take-upstream or --keep, then re-run upgrade."}, {"id": "cli-no-state", "layer": "substrate", "source": "podpack cli", "where": "both", "sev": "action", "match": "no substrate.json here -- run `podpack substrate init` first  (or: substrate.json already exists here -- ... upgrade is the command that moves it forward)", "means": "This directory was never initialised (or you ran init on an already-initialised site).", "do": "`podpack substrate init` for a new site; `podpack substrate upgrade` to move an existing one forward."}, {"id": "st-conflict", "layer": "substrate", "source": "podpack substrate", "where": "both", "sev": "action", "match": "<file>  conflict   (upgrade: podpack's version goes to <file>.new -- resolve with --take-upstream or --keep)", "means": "You edited a managed file AND upstream changed it differently; the three-way merge can't be automatic. podpack writes its version beside yours as <file>.new and does NOT advance the recorded version.", "do": "Diff the .new, then `podpack substrate upgrade --take-upstream <file>` (your copy saved as .orig) or `--keep <file>`."}, {"id": "st-new-vars-pending", "layer": "substrate", "source": "podpack substrate", "where": "both", "sev": "action", "match": "<file>  new variables pending: <VAR1>, <VAR2>   (or, during upgrade: appended new variables)", "means": "A newer podpack defines env vars your .env.example/.env has never been offered; upgrade appends them under a '# --- added by podpack substrate upgrade ---' banner (values may arrive as CHANGEME).", "do": "`podpack substrate upgrade` to append them, then set any CHANGEME values."}, {"id": "st-secrets-add-by-hand", "layer": "substrate", "source": "podpack substrate", "where": "both", "sev": "action", "match": "secrets.env  add by hand: <VAR1>, <VAR2>   (or: needs new secrets)", "means": "secrets.env is missing secrets a newer podpack expects. podpack will NEVER write this file (a default here would be a weak credential on its way to prod).", "do": "Add the named secrets to secrets.env yourself; secrets.env.example shows their shape."}, {"id": "st-locally-edited", "layer": "substrate", "source": "podpack substrate status", "where": "both", "sev": "warning", "match": "<file>  locally edited", "means": "You edited a managed file and upstream has not changed it; podpack keeps your edit. (This is what a site's own copy of a substrate file you changed on purpose shows -- e.g. an unreleased postgresql.conf tweak.)", "do": "Nothing needed. `podpack substrate diff <file>` shows the drift."}, {"id": "st-not-managed", "layer": "substrate", "source": "podpack substrate status", "where": "both", "sev": "warning", "match": "<file>  not managed here (outside the site / not a regular file / a dangling symlink)", "means": "The path (or a parent) is a symlink resolving outside the site, or the target is a directory/device/dangling symlink where a file was expected. podpack refuses to follow it.", "do": "Check for a stray symlink or odd entry on that path if you expected podpack to manage it."}, {"id": "st-status-words", "layer": "substrate", "source": "podpack substrate status", "where": "both", "sev": "info", "match": "<file>  ok | update available | update available (already applied) | seeded at <v> | seeded at <v>, since edited | removed by site", "means": "Benign per-file bookkeeping from `podpack substrate status`. 'update available (already applied)' = disk already equals the new version, only the recorded baseline lags. 'seeded ... since edited' = you edited a seed/config file, which podpack never rewrites wholesale.", "do": "Mostly nothing. `podpack substrate upgrade` settles any t did NOT run on a fresh host, the data dir wasn't empty (see pg-init-skipped)."}, {"id": "pg-ready", "layer": "container-db", "source": "postgres", "where": "both", "sev": "info", "match": "database system is ready to accept connections", "means": "Server up and listening -- the line the healthcheck waits for.", "do": "Nothing."}, {"id": "nginx-502", "layer": "external", "source": "nginx (Opalstack proxy)", "where": "host", "sev": "critical", "match": "an HTML page whose body says \"502 Bad Gateway\" with a Server: nginx header (nginx's own error page, not a podpack response). 504 = upstream too slow.", "means": "The site container isn't accepting connections on WEB_HOST_PORT -- down, unhealthy, wrong port, or never started (linger/gate failure). A status-code-only monitor can be fooled; the 502 body is nginx-generated, which is why poll-health.sh checks the body.", "do": "`podman compose ps` / `logs web`; confirm the container is healthy and bound to the allocated port."}, {"id": "podman-compose-vs-plugin", "layer": "external", "source": "podman-compose", "where": "both", "sev": "critical", "match": "(no error) services that should wait start in the same second -- the tell-tale of running under `podman-compose` (hyphen) instead of `podman compose` (space)", "means": "podman-compose (the Python tool) silently IGNORES depends_on conditions -- every ordering gate rests on them. init-storage stops preceding servers (perms break), web stops waiting for migrate, nothing waits for Postgres. A broken front end, not an alternative.", "do": "Use `podman compose` (space). `configure-host.py --check` verifies the provider is Compose v2."}, {"id": "uv-installation-plan-path", "layer": "external", "source": "uv", "where": "both", "sev": "critical", "match": "error: Failed to determine installation plan ... Distribution not found at: file:///path/to/podpack", "means": "A [tool.uv.sources] path = ... source can't be resolved inside the container build -- the build context has no such path. (This is why the site pins podpack from PyPI and the apps from git, never a local path.)", "do": "Switch the dependency to a git = \"https://...\" (or published) source, then `uv lock`."}, {"id": "git-denycurrentbranch", "layer": "external", "source": "git", "where": "host", "sev": "action", "match": "remote: error: refusing to update checked out branch: refs/heads/<branch> ... updating the current branch in a non-bare repository is denied ... ! [remote rejected] <branch> -> <branch> (branch is currently checked out)", "means": "You pushed to the branch checked out on the server's working checkout, and receive.denyCurrentBranch is at its default. Git won't move the branch out from under a live worktree.", "do": "On the host: `git config receive.denyCurrentBranch updateInstead` in ~/apps/<app>/site, then push again. (ops/DEPLOY.md sets this up.)"}, {"id": "git-non-fast-forward", "layer": "external", "source": "git", "where": "both", "sev": "action", "match": "! [rejected] <branch> -> <branch> (fetch first / non-fast-forward) ... the remote contains work that you do not have locally.", "means": "The remote has commits you don't -- common when a deploy host committed a config edit.", "do": "`git pull --rebase` then push. Never force-push a shared deploy remote without care."}, {"id": "git-updateinstead-dirty", "layer": "external", "source": "git", "where": "host", "sev": "action", "match": "! [remote rejected] <branch> -> <branch> (Working directory has unstaged changes)  /  (Untracked working tree files would be overwritten by merge)", "means": "updateInstead refuses when the server worktree is dirty or a push would overwrite untracked files -- it won't clobber edits made on the host. Config edits made in-place on the deploy checkout are the usual culprit.", "do": "On the server, commit/stash/discard the local changes (or move the untracked files), then push again."}, {"id": "podman-no-such-service", "layer": "external", "source": "podman compose", "where": "both", "sev": "action", "match": "no such service: <name>   (notably `no such service: .` from a command pasted with a trailing period)", "means": "A service name doesn't exist in the merged compose files -- a typo, wrong COMPOSE_FILE, or punctuation pasted with an inline command.", "do": "Check the name / COMPOSE_FILE. Put runnable commands on their own line so no trailing '.' is pasted."}, {"id": "uv-git-fetch-failed", "layer": "external", "source": "uv / git", "where": "both", "sev": "action", "match": "error: Failed to download and build `<pkg> @ git+https://...` ... Git operation failed (repository not found / could not read Username)", "means": "A git dependency's repo is private, unpublished, or mistyped.", "do": "Publish/point at the correct repo, or ensure credentials; then `uv lock`."}, {"id": "uv-lockfile-frozen", "layer": "external", "source": "uv", "where": "both", "sev": "action", "match": "error: The lockfile at `uv.lock` needs to be updated but `--frozen` was provided. To update the lockfile, run `uv lock`.  (also the --locked / --check variants)", "means": "pyproject.toml or [tool.uv.sources] changed but uv.lock wasn't regenerated; the frozen build refuses to drift. Editing a pin alone isn't enough.", "do": "`uv lock` and commit uv.lock, then rebuild/deploy."}];
const META = {"count": 119, "updated": "2026-09-02"};
const LAYERS = [["laptop", "Your laptop"], ["host-scripts", "Host scripts"], ["app", "The app \u2014 boot & runtime"], ["substrate", "Substrate CLI"], ["container-db", "Containers & database"], ["external", "External tools \u2014 git, uv, podman, nginx"]];
const SEV = ["critical","action","warning","info"];
const SEV_LABEL = {critical:"Critical", action:"Needs action", warning:"Warning", info:"Info"};
const WHERE_LABEL = {laptop:"laptop", host:"host", both:"either"};

const state = {q:"", sev:new Set(), where:new Set()};
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function terms(){ return state.q.toLowerCase().split(/\s+/).filter(Boolean); }
function haystack(m){ return (m.match+" "+m.means+" "+m.do+" "+m.source+" "+m.id).toLowerCase(); }
function matches(m){
  if(state.sev.size && !state.sev.has(m.sev)) return false;
  if(state.where.size && m.where!=="both" && !state.where.has(m.where)) return false;
  return terms().every(t => haystack(m).includes(t));
}
function highlight(text){
  const ts = terms(); let out = esc(text);
  for(const t of ts.sort((a,b)=>b.length-a.length)){
    if(t.length<2) continue;
    const re = new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
    out = out.replace(re, "\x01$1\x02");
  }
  return out.replace(/\x01/g,"<mark>").replace(/\x02/g,"</mark>");
}

function card(m){
  return `<div class="card ${m.sev}">
    <div class="badges">
      <span class="badge sev"><span class="dot ${m.sev}"></span>${SEV_LABEL[m.sev]}</span>
      <span class="badge where">${WHERE_LABEL[m.where]}</span>
      <span class="src mono">${esc(m.source)}</span>
    </div>
    <div class="msg mono">${highlight(m.match)}</div>
    <p class="mn"><b>Means&nbsp;</b>${esc(m.means)}</p>
    <p class="mn do"><b>Do&nbsp;</b>${esc(m.do)}</p>
  </div>`;
}

function render(){
  const shown = MESSAGES.filter(matches);
  const res = $("#results"); res.innerHTML = "";
  $("#count").textContent = shown.length===MESSAGES.length
    ? `${MESSAGES.length} messages`
    : `${shown.length} of ${MESSAGES.length} messages`;
  if(!shown.length){
    res.innerHTML = `<div class="empty">No message matches <span class="mono">${esc(state.q)||"that"}</span>.<br>Try fewer words, or the fixed part of the line.</div>`;
    return;
  }
  for(const [key,label] of LAYERS){
    const group = shown.filter(m => m.layer===key);
    if(!group.length) continue;
    const g = document.createElement("section"); g.className="group";
    g.innerHTML = `<h2>${label} · ${group.length}</h2><div class="cards">${group.map(card).join("")}</div>`;
    res.appendChild(g);
  }
}

function chip(cls, label, n, on){
  const b = document.createElement("button");
  b.className = "chip "+cls; b.setAttribute("aria-pressed","false");
  b.innerHTML = label + (n!=null?` <span class="n">${n}</span>`:"");
  b.addEventListener("click", ()=>{ on(b.getAttribute("aria-pressed")!=="true"); b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")!=="true"); render(); });
  return b;
}
function buildFilters(){
  const sf = $("#sevfilters");
  for(const s of SEV){
    const n = MESSAGES.filter(m=>m.sev===s).length;
    sf.appendChild(chip("sev-"+s, `<span class="dot ${s}"></span>${SEV_LABEL[s]}`, n, on=>{ on?state.sev.add(s):state.sev.delete(s); }));
  }
  const wf = $("#wherefilters");
  for(const w of ["laptop","host"]){
    const n = MESSAGES.filter(m=>m.where===w||m.where==="both").length;
    wf.appendChild(chip("where", `on the ${w}`, n, on=>{ on?state.where.add(w):state.where.delete(w); }));
  }
}

// theme toggle, persisted per viewer (fails silent in private windows)
const themeBtn = $("#theme");
themeBtn.addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const sysDark = matchMedia("(prefers-color-scheme:dark)").matches;
  const next = cur ? (cur==="dark"?"light":"dark") : (sysDark?"light":"dark");
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("almanac-theme", next); }catch(e){}
});
try{ const t=localStorage.getItem("almanac-theme"); if(t) document.documentElement.setAttribute("data-theme", t); }catch(e){}

const q = $("#q");
q.addEventListener("input", ()=>{ state.q=q.value; render(); });
addEventListener("keydown", e=>{
  if(e.key==="/" && document.activeElement!==q){ e.preventDefault(); q.focus(); }
  else if(e.key==="Escape" && document.activeElement===q){ q.value=""; state.q=""; render(); }
});
$("#meta").textContent = META.count + " messages · updated " + META.updated;
buildFilters(); render(); q.focus({preventScroll:true});
