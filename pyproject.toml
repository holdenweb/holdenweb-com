[project]
name = "qs"
version = "0.9.6"
description = "The holdenweb.com publishable site"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
 "pdfrw (>=0.4)",
 "werkzeug (>=2.3.8)",
 "flask (>=2.3.3)",
 "flask-wtf (>=1.2.1)",
 "qrcode>=7.4.2",
 "reportlab (>=3.6.12)",
 "markdown (>=3.5.2)",
 "python-markdown-math (>=0.8)",
 "python-dotenv (>=1.0.1,<2.0.0)",
]
[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

