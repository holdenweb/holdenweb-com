[project]
name = "holdenweb"
version = "1.8.1b3"
description = "The holdenweb.com publishable site"
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
 # The pre-release is spelled out on purpose. uv allows a pre-release only
 # where the specifier names one, so this opts podpack in and nothing else:
 # a blanket --prerelease=allow would quietly pull beta SQLAlchemy and
 # WTForms in underneath a live site. Measured, not feared.
 #
 # The floor moves with each behaviour this deployment depends on, because none
 # of them changes an API and so nothing else can record the dependency:
 #
 #   b2  reads PODPACK_PROXY_HOPS. Without it the site serves every page
 #       perfectly and puts http:// links in password-reset mail.
 #   b3  restore.sh unpacks inside the user namespace. Below it, a restore on
 #       this host fails on every file -- after replacing .env and secrets.env,
 #       so the checkout is left wearing the backup's identity and holding none
 #       of its data. Measured on Opalstack, 2026-08-24.
 "podpack>=0.9.0b4",
 "podpack-pages",
 "podpack-qrcode",
 "pp-pdf",
 "werkzeug (>=2.3.8)",
 "flask (>=2.3.3)",
 "python-dotenv (>=1.0.1,<2.0.0)",
 "psycopg2-binary>=2.9.10",
 "flask-security>=5.6.2",
 "argon2-cffi>=25.1.0",
 "flask-mailman>=1.1.1",
 "flask-paranoid>=0.3.0",
 "alembic>=1.18.5",
]
[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[build-system]
requires = [ "uv_build>=0.8.4,<0.9.0",]
build-backend = "uv_build"

# podpack is not here any more: it publishes to PyPI on every release tag, so
# it is an ordinary version specifier above. That is worth having rather than
# tidiness -- a git source resolves to whatever is on the remote *now*, and uv
# caches the ref, so moving one forward took `uv lock --upgrade-package X
# --refresh-package X` and moved silently without it.
#
# The three apps stay on git until they have PyPI publishers of their own. A
# path source is not an option for any of them: the container build context has
# no such path, and `uv sync --frozen` fails there with "Failed to determine
# installation plan". These still resolve to what is *on the remote*, so
# working locally on one means pushing before re-locking here.
[tool.uv.sources]
podpack = { path = "../podpack" }
podpack-pages = { git = "https://github.com/holdenweb/podpack-pages.git" }
podpack-qrcode = { git = "https://github.com/holdenweb/podpack-qrcode.git" }
pp-pdf = { git = "https://github.com/holdenweb/pp-pdf.git" }

[dependency-groups]
dev = [
    "playwright>=1.54.0",
    "pytest-playwright>=0.7.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Where the tests are, so a bare `pytest` does not walk the whole site.
#
# Without this it descends into hostdata/, and PostgreSQL insists its data
# directory is mode 0700 while init-postgres chowns it to the container's
# postgres uid -- which under rootless podman is a subuid the invoking user
# cannot read. Collection then aborts with PermissionError before a single test
# runs. It cannot happen on macOS, where that directory belongs to the user
# running podman machine, so it appears for the first time on a Linux host.
testpaths = ["tests"]
