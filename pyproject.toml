[project]
name = "holdenweb"
version = "1.6.0"
description = "The holdenweb.com publishable site"
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
 "podpack",
 "podpack-pages",
 "podpack-qrcode",
 "pdfrw (>=0.4)",
 "werkzeug (>=2.3.8)",
 "flask (>=2.3.3)",
 "flask-wtf (>=1.2.1)",
 "reportlab (>=3.6.12)",
 "markdown (>=3.5.2)",
 "python-dotenv (>=1.0.1,<2.0.0)",
 "psycopg2-binary>=2.9.10",
 "flask-security>=5.6.2",
 "pyuwsgi>=2.0.30",
 "argon2-cffi>=25.1.0",
 "flask-mailman>=1.1.1",
 "flask-paranoid>=0.3.0",
 "alembic>=1.18.5",
]
[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[build-system]
requires = [ "uv_build>=0.8.4,<0.9.0",]
build-backend = "uv_build"

# Path sources are for local work only: a containerised build has no such
# paths, so deploying this branch means repointing all three at git remotes
# and re-running `uv lock` (see podpack's creating-a-site.md, Part 2).
[tool.uv.sources]
podpack = { path = "/Users/sholden/sites/podpack", editable = true }
podpack-pages = { path = "/tmp/podpack-pages", editable = true }
podpack-qrcode = { path = "/tmp/podpack-qrcode", editable = true }

[dependency-groups]
dev = [
    "playwright>=1.54.0",
    "pytest>=9.1.1",
]
