[project]
name = "holdenweb"
version = "1.3a1"
description = "The holdenweb.com publishable site"
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
 "pdfrw (>=0.4)",
 "werkzeug (>=2.3.8)",
 "flask (>=2.3.3)",
 "flask-wtf (>=1.2.1)",
 "qrcode>=7.4.2",
 "reportlab (>=3.6.12)",
 "markdown (>=3.5.2)",
 "python-markdown-math (>=0.8)",
 "python-dotenv (>=1.0.1,<2.0.0)",
 "flask-sqlalchemy>=3.1.1",
 "psycopg2-binary>=2.9.10",
 "flask-security>=5.6.2",
]
[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[build-system]
requires = [ "uv_build>=0.8.4,<0.9.0",]
build-backend = "uv_build"
