[project]
name = "holdenweb"
version = "1.9.4"
description = "The holdenweb.com publishable site"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
requires-python = ">=3.12, <4.0"
keywords = ["flask", "plugins", "web", "containers", "podman"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
 # The pre-release is spelled out on purpose. uv allows a pre-release only
 # where the specifier names one, so this opts podpack in and nothing else:
 # a blanket --prerelease=allow would quietly pull beta SQLAlchemy and
 # WTForms in underneath a live site. Measured, not feared.
 #
 # The floor moves with each behaviour this deployment depends on, because none
 # of them changes an API and so nothing else can record the dependency:
 #
 #   b2  reads PODPACK_PROXY_HOPS. Without it the site serves every page
 #       perfectly and puts http:// links in password-reset mail.
 #   b3  restore.sh unpacks inside the user namespace. Below it, a restore on
 #       this host fails on every file -- after replacing .env and secrets.env,
 #       so the checkout is left wearing the backup's identity and holding none
 #       of its data. Measured on Opalstack, 2026-08-24.
 "podpack>=0.9.3",
 #
 # The apps, from PyPI since 2026-09-14. Each floor is the version carrying
 # something this deployment depends on, not merely the newest available:
 #
 #   pages 0.3.4      0.3.3 brought the section subnav and the Markdown work
 #                    under it -- fenced code highlighted, Pygments a runtime
 #                    dependency, codehilite.css included so this site's
 #                    override wins. 0.3.4 stops a relative link to another page
 #                    being rewritten to the asset route, where it arrived as a
 #                    bare document with the site lost around it. No page here
 #                    exercises that today; the floor is at 0.3.4 so a resolve
 #                    cannot quietly fall back to the behaviour that loses the
 #                    chrome on the generated trees still to come.
 #   qrcode 0.2.2     0.2.1's nav entry names the endpoint `podpack_qrcode.form`
 #                    while the blueprint is `qrcode`, and podpack treats a nav
 #                    entry naming no view as a boot failure. Below this floor
 #                    the site does not start at all.
 #   pdf 0.2.2        the rename: distribution podpack-pdf, import podpack_pdf,
 #                    app `pdf` -- which is what config/app.toml lists and what
 #                    templates/pdf/ overrides.
 #   notebooks 0.1.1  the app as installed here.
 "podpack-pages==0.3.5",
 "podpack-qrcode>=0.2.2",
 "podpack-pdf>=0.2.2",
 "podpack-notebooks>=0.1.1",
 "werkzeug (>=2.3.8)",
 "flask (>=2.3.3)",
 "python-dotenv (>=1.0.1,<2.0.0)",
 "psycopg2-binary>=2.9.10",
 # flask-security-too, NOT flask-security: both ship the `flask_security` import
 # package, and podpack already depends on -too (login is core, ADR-0033).
 # Declaring the other one too installs both into one namespace; their classes
 # collide and login dies with AttributeError: 'User' object has no 'is_locked'.
 "flask-security-too>=5.6.2",
 "argon2-cffi>=25.1.0",
 "flask-mailman>=1.1.1",
 "flask-paranoid>=0.3.0",
 "alembic>=1.18.5",
]
[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[build-system]
requires = [ "uv_build>=0.8.4,<0.9.0",]
build-backend = "uv_build"

# [tool.uv.sources] goes here for local development.
#

[dependency-groups]
dev = [
    "linkchecker>=10.6.0",
    "playwright>=1.54.0",
    "pytest-playwright>=0.7.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Where the tests are, so a bare `pytest` does not walk the whole site.
#
# Without this it descends into hostdata/, and PostgreSQL insists its data
# directory is mode 0700 while init-postgres chowns it to the container's
# postgres uid -- which under rootless podman is a subuid the invoking user
# cannot read. Collection then aborts with PermissionError before a single test
# runs. It cannot happen on macOS, where that directory belongs to the user
# running podman machine, so it appears for the first time on a Linux host.
testpaths = ["tests"]
