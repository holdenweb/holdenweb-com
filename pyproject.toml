[project]
name = "holdenweb"
version = "1.6.0"
description = "The holdenweb.com publishable site"
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
 "podpack",
 "podpack-pages",
 "podpack-qrcode",
 "pp-pdf",
 "werkzeug (>=2.3.8)",
 "flask (>=2.3.3)",
 "python-dotenv (>=1.0.1,<2.0.0)",
 "psycopg2-binary>=2.9.10",
 "flask-security>=5.6.2",
 "argon2-cffi>=25.1.0",
 "flask-mailman>=1.1.1",
 "flask-paranoid>=0.3.0",
 "alembic>=1.18.5",
]
[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[build-system]
requires = [ "uv_build>=0.8.4,<0.9.0",]
build-backend = "uv_build"

# Git sources, because a path source cannot survive a container build: the
# build context has no such path and `uv sync --frozen` fails with "Failed to
# determine installation plan". Note these resolve to what is *on the remote*,
# so working locally on any of them means pushing before re-locking here.
[tool.uv.sources]
podpack = { git = "https://github.com/holdenweb/podpack.git" }
podpack-pages = { git = "https://github.com/holdenweb/podpack-pages.git" }
podpack-qrcode = { git = "https://github.com/holdenweb/podpack-qrcode.git" }
pp-pdf = { git = "https://github.com/holdenweb/pp-pdf.git" }

[dependency-groups]
dev = [
    "playwright>=1.54.0",
    "pytest-playwright>=0.7.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Where the tests are, so a bare `pytest` does not walk the whole site.
#
# Without this it descends into hostdata/, and PostgreSQL insists its data
# directory is mode 0700 while init-postgres chowns it to the container's
# postgres uid -- which under rootless podman is a subuid the invoking user
# cannot read. Collection then aborts with PermissionError before a single test
# runs. It cannot happen on macOS, where that directory belongs to the user
# running podman machine, so it appears for the first time on a Linux host.
testpaths = ["tests"]
