name: holdenweb-lab

# Local production-shaped stack: a Flask app (behind gunicorn) plus a MongoDB
# Community Edition server. Neither container owns any state or any
# host-specific setting:
#
#   * persistent state  -> bind-mounted from ${HOST_DATA_DIR} on the host
#   * host-specific cfg -> bind-mounted read-only from ./config
#   * secrets / wiring  -> environment, via .env
#
# so the same images can be promoted to a real host by changing only .env
# and the contents of the mounted directories.

services:
  # Bind-mounted host directories arrive owned by whoever owns them on the
  # host, which is never the unprivileged uid a server drops to. This
  # short-lived root container fixes that once, before anything else starts,
  # so the suite comes up on a bare machine with no manual chown step.
  #
  # It is not a security hole: under rootless podman "root" here is your own
  # user in a namespace, and uid 999/10001 map to your subuids. On macOS the
  # change is namespace-local -- the host keeps its own ownership.
  init-storage:
    image: docker.io/library/busybox:1.37
    user: "0:0"
    command:
      - sh
      - -c
      - |
        set -e
        chown -R 999:999    /mnt/mongo-data /mnt/mongo-configdb /mnt/mongo-logs
        chown -R 10001:10001 /mnt/uploads /mnt/web-logs
        echo "host storage ownership prepared"
    volumes:
      - ${HOST_DATA_DIR}/mongo/data:/mnt/mongo-data
      - ${HOST_DATA_DIR}/mongo/configdb:/mnt/mongo-configdb
      - ${HOST_DATA_DIR}/uploads:/mnt/uploads
      - ${HOST_LOG_DIR}/mongo:/mnt/mongo-logs
      - ${HOST_LOG_DIR}/web:/mnt/web-logs

  mongo:
    # MongoDB Community Edition. `mongodb/mongodb-community-server` is the
    # vendor-published equivalent if you would rather track their tags.
    image: docker.io/library/mongo:8.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Consumed once, by the image's first-run bootstrap (see mongo-init/).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    # Take the server's own settings from the host-mounted config file rather
    # than from a pile of command-line flags, so tuning the database on a real
    # host is an edit-and-restart rather than a compose change.
    command: ["mongod", "--config", "/etc/mongo/mongod.conf"]
    volumes:
      # Host storage. On SELinux hosts (RHEL/Fedora) append `,Z` to each of
      # these; on macOS/Windows podman machine the label is unnecessary.
      - ${HOST_DATA_DIR}/mongo/data:/data/db
      - ${HOST_DATA_DIR}/mongo/configdb:/data/configdb
      - ${HOST_LOG_DIR}/mongo:/var/log/mongodb
      # Host-specific configuration, read-only (append `,z` under SELinux).
      - ./config/mongod.conf:/etc/mongo/mongod.conf:ro
      # First-run bootstrap; only runs while /data/db is empty.
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    depends_on:
      init-storage:
        condition: service_completed_successfully
    ports:
      # Bound to loopback so the lab database is reachable from mongosh /
      # Compass on the host, but never from the network.
      - "127.0.0.1:${MONGO_HOST_PORT}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/holdenweb-lab-web:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The app itself only ever sees a URI; who assembled it is not its
      # problem. `mongo` resolves on the compose network.
      MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=${MONGO_DB}
      APP_CONFIG: /etc/holdenweb/app.toml
      APP_UPLOAD_DIR: /var/lib/holdenweb/uploads
      APP_LOG_DIR: /var/log/holdenweb
    volumes:
      # As above: add `,Z` to the writable mounts and `,z` to the read-only
      # one on SELinux hosts. See README, "Running on Linux".
      - ${HOST_DATA_DIR}/uploads:/var/lib/holdenweb/uploads
      - ${HOST_LOG_DIR}/web:/var/log/holdenweb
      - ./config/app.toml:/etc/holdenweb/app.toml:ro
    ports:
      - "127.0.0.1:${WEB_HOST_PORT}:8000"
    depends_on:
      init-storage:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    healthcheck:
      # A script, not a `python -c` one-liner: podman splits ["CMD", ...]
      # arguments on whitespace, so any argument containing spaces arrives
      # mangled. See app/healthcheck.py.
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
