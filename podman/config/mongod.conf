# Host-specific MongoDB configuration, bind-mounted read-only at
# /etc/mongo/mongod.conf. Edit here and `podman compose restart mongo`; the
# image itself never changes.
#
# Reference: https://www.mongodb.com/docs/manual/reference/configuration-options/

storage:
  # Must match the container-side path of the host data bind mount.
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      # A laptop should not hand half its RAM to WiredTiger. Raise this to
      # something realistic (or drop the key to accept the default of
      # 50% of RAM - 1GB) when the same file is deployed to a real host.
      cacheSizeGB: 0.5

systemLog:
  destination: file
  # Host-mounted, so logs survive the container and are readable with the
  # host's own tooling.
  path: /var/log/mongodb/mongod.log
  logAppend: true

net:
  port: 27017
  # 0.0.0.0 inside the container's own network namespace. Exposure to the
  # outside world is decided by the port mapping in compose.yaml, which binds
  # to 127.0.0.1 only.
  bindIp: 0.0.0.0

security:
  authorization: enabled

operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 200
