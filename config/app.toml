# This site's configuration. In a container it is bind-mounted read-only at
# /etc/podpack/app.toml; locally, point PODPACK_CONFIG at it.

[site]
name = "holdenweb.com"

# Installed apps, by *import* name, in installation order -- which is also nav
# order: `holdenweb` is the site's own routes and must come first so its front
# page claims `/`. pybooks and blog contribute the Python and Blog nav entries;
# plain `podpack_pages` (at /pages) contributes none.
apps = ["holdenweb", "podpack_pages.pybooks", "podpack_pages.blog", "podpack_notebooks", "podpack_pages", "podpack_qrcode", "podpack_pdf"]

# Environment variables this site needs beyond podpack's own three, checked at
# boot with them. Names here, values in the environment -- the same split as
# everywhere else. Without this, a missing mail password surfaces when a
# visitor asks for a password reset rather than when the site starts.
secrets = ["MAIL_PASSWORD"]

[database]
pool_pre_ping = true

# The cap podpack turns into MAX_CONTENT_LENGTH, so a request larger than this
# is refused with 413 before any view reads a byte of it.
#
# There was no [limits] section at all until now, which means the value was
# unset and uploads to this site were unbounded -- and the pdf app has been
# accepting them. An unbounded upload is not a clever attack, it is a way to
# fill the host's disk or the process's memory with one long POST.
#
# 20 MiB rather than podpack's lab default of 1 MiB: the booklet maker's whole
# purpose is real scanned documents, and a 1 MiB cap would reject most of them
# with a 413 the app never sees and cannot explain (podpack-pdf's README says
# so). An app that wants a tighter bound sets its own -- podpack-pdf already
# caps by page count in [apps.pdf], which is the limit that actually protects
# its splitter, since that builds the whole zip in memory.
[limits]
max_upload_bytes = 20971520

# Keyed by each app's own name -- its blueprint's -- not the import name above.
[apps.pages]
default_title = "Just another holdenweb note"
# Show a section nav of the current directory's sibling pages. Opt-in because
# the pages-kind views are shared: pybooks carries orpy's own course nav and
# wants no second one, so it does not set this.
subnav = true

[apps.pybooks]
default_title = "Holden Web Python"

[apps.blog]
# image_root is optional -- where a post's images resolve; unset, they resolve
# under this app's own mount, which is right when the export ships its images.
