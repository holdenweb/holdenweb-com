name: CI

on:
  push:
    # `deploy/**` as well as main: ops/deploy.sh publishes the commit it is
    # deploying to refs/heads/deploy/<target> so the host can fetch it, and a
    # commit that reaches a real host should be tested even when it is not on
    # main -- which is most of them, since staging exists to try unmerged work.
    # This is still advisory and not a gate (HW-0029): it runs alongside the
    # deploy, not before it.
    branches: [main, "deploy/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy values so the app can boot in CI -- no real secrets or
      # infrastructure needed since tests use an in-memory sqlite DB and
      # the dummy mail backend (see tests/conftest.py).
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      SECRET_KEY: ci-test-secret-key
      SECURITY_PASSWORD_SALT: ci-test-password-salt
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
