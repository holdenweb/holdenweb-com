name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy values so the app can boot in CI -- no real secrets or
      # infrastructure needed since tests use an in-memory sqlite DB and
      # the dummy mail backend (see tests/conftest.py).
      SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
      SECRET_KEY: ci-test-secret-key
      SECURITY_PASSWORD_SALT: ci-test-password-salt
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest
