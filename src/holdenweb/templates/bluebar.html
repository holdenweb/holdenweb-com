<div class="bluebar">
    {% if current_user.is_anonymous %}
        <a href="/login">login</a>
    {% else %}
        {# Native <details> disclosure -- no Bootstrap/jQuery. Toggles on click;
           the panel is positioned by .acct-menu in styles.css. #}
        <details class="acct">
            <summary>{{ current_user.username or current_user.email }}</summary>
            <div class="acct-menu">
                <a href="#">Profile</a>
                <a href="#">Settings</a>
                <hr>
                <a href="/logout">Sign Out</a>
            </div>
        </details>
    {% endif %}
</div>
