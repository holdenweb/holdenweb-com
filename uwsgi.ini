[uwsgi]
master = True
http-socket = 127.0.0.1:48381
virtualenv = /home/sholden/apps/staging/env/
daemonize = /home/sholden/logs/apps/staging/uwsgi.log
pidfile = /home/sholden/apps/staging/tmp/staging.pid
workers = 2
threads = 2

# adjust the following to point to your project
wsgi-file = /home/sholden/apps/staging/myapp/wsgi.py
touch-reload = /home/sholden/apps/staging/myapp/wsgi.py